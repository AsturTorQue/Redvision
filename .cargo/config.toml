# Windows: enlazar el runtime de C estáticamente para que el .exe funcione en un Windows
# recién instalado (máquinas virtuales incluidas) sin instalar «Visual C++ Redistributable».
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
