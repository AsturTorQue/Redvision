name: Compilar RedVisión

# Cada cambio en main compila y guarda los paquetes en Actions.
# Al subir una etiqueta v* (por ejemplo v0.1.0) además se publican en Releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (AppImage, .deb, .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev file
      - name: Versión
        run: echo "VERSION=$(if [[ '${{ github.ref }}' == refs/tags/v* ]]; then echo '${{ github.ref_name }}' | sed 's/^v//'; else grep -m1 '^version' Cargo.toml | cut -d'"' -f2; fi)" >> $GITHUB_ENV
      - name: Compilar
        run: cargo build --release --locked
      - name: Pruebas (traducciones alineadas)
        run: cargo test --release --locked
      - name: AppImage
        run: |
          set -e
          APPDIR=RedVision.AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/512x512/apps
          cp target/release/redvision $APPDIR/usr/bin/
          cp packaging/linux/redvision.desktop $APPDIR/usr/share/applications/
          cp packaging/linux/redvision.desktop $APPDIR/
          cp assets/icon.png $APPDIR/usr/share/icons/hicolor/512x512/apps/redvision.png
          cp assets/icon.png $APPDIR/redvision.png
          ln -s usr/bin/redvision $APPDIR/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool $APPDIR dist/RedVision-$VERSION-linux-x86_64.AppImage
      - name: Paquete .deb
        run: |
          set -e
          PKG=redvision_${VERSION}_amd64
          mkdir -p $PKG/DEBIAN $PKG/usr/bin $PKG/usr/share/applications $PKG/usr/share/icons/hicolor/512x512/apps
          cp target/release/redvision $PKG/usr/bin/
          cp packaging/linux/redvision.desktop $PKG/usr/share/applications/
          cp assets/icon.png $PKG/usr/share/icons/hicolor/512x512/apps/redvision.png
          cat > $PKG/DEBIAN/control <<EOF
          Package: redvision
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgl1, libxkbcommon0, iputils-ping
          Recommends: traceroute, tcpdump
          Maintainer: AsturTorQue <6554947+AsturTorQue@users.noreply.github.com>
          Description: Analizador de red de escritorio
           Mapa de red, puertos, captura y análisis de paquetes, latencia, QoE,
           DNS, vulnerabilidades, detección de intrusos y monitorización.
          EOF
          sed -i 's/^          //' $PKG/DEBIAN/control
          dpkg-deb --build --root-owner-group $PKG dist/$PKG.deb
      - name: Archivo .tar.gz
        run: |
          mkdir -p tarball
          cp target/release/redvision README.md LICENSE tarball/
          tar -czf dist/RedVision-$VERSION-linux-x86_64.tar.gz -C tarball .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows (instalador .exe y portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versión
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".Substring(1) }
          else { $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compilar
        run: cargo build --release --locked
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$env:GITHUB_WORKSPACE\target\release\redvision.exe" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\redvision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable
        shell: pwsh
        run: |
          Copy-Item target\release\redvision.exe "dist\RedVision-$env:VERSION-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Versión
        run: echo "VERSION=$(if [[ '${{ github.ref }}' == refs/tags/v* ]]; then echo '${{ github.ref_name }}' | sed 's/^v//'; else grep -m1 '^version' Cargo.toml | cut -d'"' -f2; fi)" >> $GITHUB_ENV
      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Aplicación .app y .dmg
        run: |
          set -e
          APP=RedVision.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources icon.iconset
          cp target/${{ matrix.target }}/release/redvision $APP/Contents/MacOS/redvision
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null || true
          done
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/redvision.icns
          cat > $APP/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>RedVisión</string>
            <key>CFBundleDisplayName</key><string>RedVisión</string>
            <key>CFBundleIdentifier</key><string>io.github.asturtorque.redvision</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>redvision</string>
            <key>CFBundleIconFile</key><string>redvision</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - $APP
          mkdir -p dmg dist
          cp -R $APP dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "RedVision" -srcfolder dmg -ov -format UDZO dist/RedVision-$VERSION-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publicar en Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: RedVisión ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
