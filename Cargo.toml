[package]
name = "redvision"
version = "0.11.0"
edition = "2021"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
chrono = "0.4"

# Windows: segundo motor gráfico (DirectX/WARP, también por software) por si el equipo no
# ofrece OpenGL, como pasa en muchas máquinas virtuales.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
# eframe compila wgpu solo con los controladores de Mac y web: sin esto en Windows no hay
# ninguna tarjeta que encontrar. DirectX 12 incluye WARP, el dibujo por software de Windows.
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
